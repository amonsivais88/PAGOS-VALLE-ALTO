// Fecha de vencimiento efectiva de un cargo: usa el campo fechaVencimiento si esta guardado,
// y si no (ej. cargos capturados manualmente via "Registrar Pago", que historicamente nunca

// manual nunca se consideraba "vencido" sin importar cuantos meses de atraso tuviera.
const fechaVencimientoEfectiva = p => {
  if (p.fechaVencimiento) return p.fechaVencimiento;
  if (!p.fecha) return null;
  const d = new Date(p.fecha + 'T00:00:00');
  if (isNaN(d)) return null;
  const ult = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(ult.getDate()).padStart(2, '0');

const esVencido = (p, hoyStr) => {
  const fv = fechaVencimientoEfectiva(p);

      };

        if (p.metodoPago === 'Saldo a Favor') map[p.unidadId].cargosConFavor += Number(p.monto);

        else if (p.estatus === 'parcial') map[p.unidadId].pendiente += Number(p.saldoPendiente || 0);
        if (!esCubiertoPorOtroMedio(p)) map[p.unidadId].pagado += montoRecaudadoPropio(p);

            nota: debeSepararComoMora ? ('Se aplicaron ' + fmt(montoRestante) + ' via Pagos en Mora folio MORA-' + (cargo.folio || cargo.id).toString().slice(-8) + ' (no se suma aqui para no inflar este mes)') : 'Pago parcial'
          };
          if (!debeSepararComoMora) updData.fechaPago = hoy;
          batch.update(db.collection('pagos').doc(cargo.id), updData);
          if (debeSepararComoMora && montoRestante > 0.01) {
            batch.set(db.collection('pagos').doc(), {
              unidadId: uid,
              concepto: 'Pagos en Mora',
              monto: montoRestante,
              fecha: hoy,
              fechaPago: hoy,
              folio: 'MORA-' + (cargo.folio || cargo.id).toString().slice(-8),
              tipoMov: 'abono',
              estatus: 'pagado',
              metodoPago: metodo === 'Saldo a Favor' ? 'Saldo a Favor (reaplicado)' : metodo,
              cancelado: false,
              nota: 'Abono adicional sobre saldo de ' + (cargo.concepto || 'cargo') + ' de ' + String(cargo.fecha || '').slice(0, 7),
              createdAt: new Date().toISOString()
            });
          }
          montoRestante = 0;
        }
      }
    };

    // PASADA 1: cargos que coinciden con el criterio original (mismo concepto, o vencidos de
    // cualquier concepto si el abono es explicitamente "Pagos en Mora", o todos por prioridad
    // si no se especifico concepto - ej. conciliacion bancaria).
    let candidatos1 = cargosTodos;
    if (concepto === 'Pagos en Mora') {
      candidatos1 = candidatos1.filter(c => esVencido(c, hoy));
    } else if (concepto) {
      candidatos1 = candidatos1.filter(c => c.concepto === concepto);
    }
    candidatos1 = candidatos1.sort((a, b) => {
      if (concepto) return String(a.fecha || '').localeCompare(String(b.fecha || ''));
      const pA = prioridadConcepto(a.concepto), pB = prioridadConcepto(b.concepto);
      if (pA !== pB) return pA - pB;
      return String(a.fecha || '').localeCompare(String(b.fecha || ''));
    });
    procesarLista(candidatos1, false);

    // (no "Pagos en Mora", que ya barrio todo en la pasada 1, y no vacio, que ya uso prioridad
    // entre todos los conceptos), se intenta aplicar el remanente contra deuda VENCIDA de
    // CUALQUIER OTRO concepto antes de mandarlo a Saldo a Favor. Esto es lo que antes hacia
    // "Pagos en Mora" solo si se elegia ese concepto a mano - ahora es automatico para

    // conceptos en cargos que AUN no estan vencidos (esVencido exige que ya haya pasado su
    // fecha de vencimiento, nunca toca cargos recientes de otro concepto).
    if (montoRestante > 0.01 && concepto && concepto !== 'Pagos en Mora') {
      const candidatos2 = cargosTodos.filter(c => !procesadosIds.has(c.id) && esVencido(c, hoy))
        .sort((a, b) => String(a.fecha || '').localeCompare(String(b.fecha || '')));
      procesarLista(candidatos2, true);
    }

    if (montoRestante > 0.01) {
      batch.set(db.collection('pagos').doc(), {
        unidadId: uid,
        concepto: 'Saldo a Favor',
        monto: montoRestante,
        fecha: hoy,
        folio: 'A FAVOR',
        tipoMov: 'abono',
        estatus: 'a_favor',
        cancelado: false,
        conceptoOrigen: concepto || null,
        nota: 'Remanente de abono de ' + fmt(montoAbono) + (concepto ? ' (' + concepto + ')' : '') + (cargosTodos.length === 0 ? ' - sin cargos pendientes' : ''),
        createdAt: new Date().toISOString()
      });

    return cargosLiquidados;
  };

  const sanitize = str => {
    if (!str) return '';
    var s = String(str);
    var result = '';
    for (var i = 0; i < s.length; i++) {
      var code = s.charCodeAt(i);
      if (code <= 127) {
        result += s[i];
      } else if (code === 225 || code === 224 || code === 226 || code === 227) {
        result += 'a';
      } else if (code === 233 || code === 232 || code === 234) {
        result += 'e';
      } else if (code === 237 || code === 236 || code === 238) {
        result += 'i';
      } else if (code === 243 || code === 242 || code === 244 || code === 245) {
        result += 'o';
      } else if (code === 250 || code === 249 || code === 251) {
        result += 'u';
      } else if (code === 193) {
        result += 'A';
      } else if (code === 201) {
        result += 'E';
      } else if (code === 205) {
        result += 'I';
      } else if (code === 211) {
        result += 'O';
      } else if (code === 218) {
        result += 'U';
      } else if (code === 241 || code === 209) {
        result += code === 241 ? 'n' : 'N';
      } else if (code === 183 || code === 8212 || code === 8211 || code === 8722) {
        result += '-';
      } else if (code === 9472) {
        result += '-';
      } else {
        result += '';
      }
    }
    return result;
  };
  const genReportePresent = async ({

    // aparece duplicado/mal clasificado en el prompt (ej. como moroso aunque ya pago,
    // porque su pago quedo "fichado" bajo un nombre distinto al que usa el resto del sistema).
    const normUid = uid => (uid === 'Piso 8' || uid === 'PISO 8' || uid === 'piso 8') ? 'P8' : uid;
    const pagosMes = pagos.filter(p => {
      if (p.cancelado) return false;
      const f = new Date(fechaEfectiva(p) + 'T00:00:00');
      return f.getMonth() + 1 === mes && f.getFullYear() === ano;
    });
    const gastosMes = gastos.filter(g => {

    // Se incluye el monto ya cobrado (montoPagado) de los cargos en estatus 'parcial',
    // igual que ya hacia serieMes y el KPI "Total Recaudado" del dashboard. Antes solo se
    // sumaban cargos 100% 'pagado', por lo que el reporte mostraba menos dinero recaudado
    // del que realmente ya habia entrado (la parte cobrada de cada pago parcial se perdia).
    const ingConc = {};
    pagosMes.forEach(p => {
      if (esCubiertoPorOtroMedio(p)) return;
      const monto = montoRecaudadoPropio(p);
      if (monto <= 0) return;
      ingConc[p.concepto] = (ingConc[p.concepto] || 0) + monto;
    });
    const totalIngMes = Object.values(ingConc).reduce((s, v) => s + v, 0);
    const gastosOp = gastosMes.filter(g => g.tipoGasto === 'operativo' || !g.tipoGasto);
    const gastosEx = gastosMes.filter(g => g.tipoGasto === 'extraordinario');
    const totalGastosOp = gastosOp.reduce((s, g) => s + Number(g.monto), 0);
    const totalGastosEx = gastosEx.reduce((s, g) => s + Number(g.monto), 0);
    const totalGastosMes = totalGastosOp + totalGastosEx;
    // NOTA: el saldo de caja acumulado (saldoCajaMesAnterior/saldoCajaMesActual) se calcula
    // mas abajo, despues de construir serieMes, siguiendo la formula:
    // Saldo del Mes = Saldo Mes Anterior + Ingresos del Mes - Gastos del Mes
    const morosos = new Set(pagosMes.filter(p => p.estatus === 'pendiente').map(p => normUid(p.unidadId)));
    const alCorriente = new Set(pagosMes.filter(p => p.estatus === 'pagado' && !esCubiertoPorOtroMedio(p)).map(p => normUid(p.unidadId)));
    const soloMorosos = [...morosos].filter(id => !alCorriente.has(id));
    // Igual que ingConc/desgloseMes: se incluye la parte ya cobrada (montoPagado) y la parte

    const montoPagado = pagosMes.reduce((s, p) => {

    const mapMor = {};

      const uid = normUid(p.unidadId);
      mapMor[uid] = (mapMor[uid] || 0) + Number(p.monto);

    const gastosAntesDelAno = gastos.filter(g => String(g.fecha || '') <= finAnoAnteriorStr).reduce((s, g) => s + Number(g.monto), 0);
    let cumSaldo = ingresosAntesDelAno - gastosAntesDelAno;
